<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>안전점검 체크리스트</title>
<style>
  :root{
    --bg:#f4f5f7;
    --card:#ffffff;
    --ink:#1c1f24;
    --sub:#6b7280;
    --line:#e6e8eb;
    --blue:#2563eb;
    --green:#16a34a;
    --green-bg:#dcfce7;
    --red:#dc2626;
    --red-bg:#fee2e2;
    --gray-bg:#eceef1;
    --yellow:#b45309;
    --yellow-bg:#fef3c7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding-bottom:110px;
  }
  header{
    position:sticky;top:0;z-index:10;
    background:var(--card);
    border-bottom:1px solid var(--line);
    padding:14px 16px 12px;
  }
  header h1{
    font-size:17px;margin:0 0 10px;font-weight:700;
  }
  .field-row{display:flex;gap:8px;}
  .field{flex:1;display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:11px;color:var(--sub);font-weight:600;}
  select, input[type=date]{
    width:100%;
    padding:9px 8px;
    border:1px solid var(--line);
    border-radius:10px;
    font-size:14px;
    background:#fafafa;
    color:var(--ink);
  }
  .summary{
    display:flex;gap:8px;margin-top:10px;
  }
  .stat{
    flex:1;background:var(--gray-bg);border-radius:10px;
    padding:8px 6px;text-align:center;
  }
  .stat .num{font-size:16px;font-weight:800;}
  .stat .lbl{font-size:10px;color:var(--sub);margin-top:2px;}
  .stat.score .num{color:var(--blue);}

  main{padding:12px;}
  .item-card{
    background:var(--card);
    border-radius:14px;
    padding:12px 14px 14px;
    margin-bottom:10px;
    border:1px solid var(--line);
  }
  .item-top{
    display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;
  }
  .item-title{font-size:14px;font-weight:600;line-height:1.4;flex:1;}
  .item-idx{font-size:11px;color:var(--sub);font-weight:600;margin-right:4px;}
  .badge-score{
    flex-shrink:0;
    font-size:11px;font-weight:700;
    background:var(--gray-bg);color:var(--sub);
    border-radius:8px;padding:3px 8px;white-space:nowrap;
  }
  .options{display:flex;gap:6px;flex-wrap:wrap;}
  .opt{
    flex:1;min-width:70px;
    text-align:center;
    padding:8px 4px;
    border-radius:9px;
    border:1.5px solid var(--line);
    font-size:12.5px;font-weight:700;
    color:var(--sub);
    background:#fafafa;
    user-select:none;
    cursor:pointer;
    transition:all .12s;
  }
  .opt.active[data-v="적합"]{background:var(--green-bg);border-color:var(--green);color:var(--green);}
  .opt.active[data-v="부적합"]{background:var(--red-bg);border-color:var(--red);color:var(--red);}
  .opt.active[data-v="N/A"]{background:var(--gray-bg);border-color:#9ca3af;color:#4b5563;}
  .opt.active[data-v="미평가"]{background:var(--yellow-bg);border-color:var(--yellow);color:var(--yellow);}

  .item-card.unchecked{border-color:#f0b8b8;}

  footer{
    position:fixed;bottom:0;left:0;right:0;
    background:var(--card);
    border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    display:flex;gap:8px;
    z-index:10;
  }
  footer button{
    flex:1;
    padding:13px 0;
    border-radius:12px;
    border:none;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
  }
  #saveBtn{background:var(--blue);color:#fff;}
  #resetBtn{background:var(--gray-bg);color:var(--ink);}
  #shareBtn{background:#111827;color:#fff;}

  .toast{
    position:fixed;left:50%;bottom:90px;transform:translateX(-50%);
    background:#111827;color:#fff;padding:9px 16px;border-radius:20px;
    font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;
  }
  .toast.show{opacity:1;}

  .note{
    font-size:11px;color:var(--sub);text-align:center;margin:6px 0 2px;
  }
</style>
</head>
<body>

<header>
  <h1>🦺 현장 안전점검 체크리스트</h1>
  <div class="field-row">
    <div class="field">
      <label>현장</label>
      <select id="siteSelect"></select>
    </div>
    <div class="field">
      <label>점검일자</label>
      <input type="date" id="dateInput">
    </div>
  </div>
  <div class="summary">
    <div class="stat score"><div class="num" id="scoreNum">-</div><div class="lbl">환산 점수</div></div>
    <div class="stat"><div class="num" id="doneNum">0/18</div><div class="lbl">점검 완료</div></div>
    <div class="stat"><div class="num" id="failNum">0</div><div class="lbl">부적합</div></div>
  </div>
</header>

<main id="list"></main>

<div class="toast" id="toast">저장되었습니다</div>

<footer>
  <button id="resetBtn">초기화</button>
  <button id="saveBtn">저장</button>
  <button id="shareBtn">결과 복사</button>
</footer>

<script>
const SITES = [
  "스테이지 1","스테이지 2","스테이지 3","스테이지 4","스테이지 5","스테이지 6",
  "스테이지 7","스테이지 8","스테이지 9","스테이지 10","스테이지 11","스테이지 12","스테이지 13",
  "오픈세트1","오픈세트2","아일랜드"
];

const ITEMS = [
  ["안전난간 미설치·파손",10],
  ["작업발판 미설치·틈새 과다",10],
  ["이동식틀비계 안전조치 미흡",10],
  ["A형 사다리 부적정 사용",5],
  ["고소작업대 안전장치 해제·과상승",10],
  ["지게차 유도자·작업계획 미비",10],
  ["장비작업구간 통제 미흡",10],
  ["전동공구·수공구 안전장치 미설치 및 부적정 사용",5],
  ["화기작업 소화기·감시자 미배치",10],
  ["가설전기 피복손상·문어발·접지불량",10],
  ["분전함 잠금·표지 미비",5],
  ["안전모 및 안전대 미착용",5],
  ["비상통로·소화기 접근 방해",5],
  ["자재·폐자재 적치로 통로 폐쇄",5],
  ["작업구간 정리상태 불량",2],
  ["작업계획서 미제출·미준수",5],
  ["전일 부적합 사항 개선조치 이행여부",10],
  ["상기 외 지적사항",2]
];

const STATUSES = ["적합","부적합","N/A","미평가"];

let state = {}; // { itemIndex: status }
let memoryStore = {}; // fallback if window.storage unavailable

const siteSelect = document.getElementById('siteSelect');
const dateInput = document.getElementById('dateInput');
const list = document.getElementById('list');

SITES.forEach(s=>{
  const o = document.createElement('option');
  o.value = s; o.textContent = s;
  siteSelect.appendChild(o);
});

function todayStr(){
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
dateInput.value = todayStr();

function currentKey(){
  return `checklist:${siteSelect.value}:${dateInput.value}`;
}

async function storageGet(key){
  try{
    const r = await window.storage.get(key, false);
    return r ? r.value : null;
  }catch(e){
    return memoryStore[key] || null;
  }
}
async function storageSet(key, value){
  try{
    await window.storage.set(key, value, false);
  }catch(e){
    memoryStore[key] = value;
  }
}

function renderList(){
  list.innerHTML = '';
  ITEMS.forEach((item, idx)=>{
    const [title, score] = item;
    const card = document.createElement('div');
    card.className = 'item-card';
    card.dataset.idx = idx;

    const top = document.createElement('div');
    top.className = 'item-top';
    top.innerHTML = `<div class="item-title"><span class="item-idx">${idx+1}.</span>${title}</div>
                      <div class="badge-score">${score}점</div>`;
    card.appendChild(top);

    const opts = document.createElement('div');
    opts.className = 'options';
    STATUSES.forEach(st=>{
      const o = document.createElement('div');
      o.className = 'opt';
      o.dataset.v = st;
      o.textContent = st;
      o.addEventListener('click', ()=>{
        state[idx] = (state[idx] === st) ? null : st;
        renderList();
        updateSummary();
      });
      opts.appendChild(o);
    });
    card.appendChild(opts);
    list.appendChild(card);

    const active = state[idx];
    if(active){
      card.classList.remove('unchecked');
      opts.querySelectorAll('.opt').forEach(o=>{
        o.classList.toggle('active', o.dataset.v === active);
      });
    } else {
      card.classList.add('unchecked');
    }
  });
}

function updateSummary(){
  let done = 0, fail = 0;
  let totalWeight = 0, earned = 0;
  ITEMS.forEach((item, idx)=>{
    const [, score] = item;
    const st = state[idx];
    if(st) done++;
    if(st === '부적합') fail++;
    if(st === '적합' || st === '부적합'){
      totalWeight += score;
      if(st === '적합') earned += score;
    }
  });
  document.getElementById('doneNum').textContent = `${done}/${ITEMS.length}`;
  document.getElementById('failNum').textContent = fail;
  const scoreEl = document.getElementById('scoreNum');
  if(totalWeight === 0){
    scoreEl.textContent = '-';
  } else {
    scoreEl.textContent = Math.round((earned/totalWeight)*100) + '점';
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1400);
}

async function loadForCurrentKey(){
  const raw = await storageGet(currentKey());
  state = {};
  if(raw){
    try{
      const parsed = JSON.parse(raw);
      ITEMS.forEach((_, idx)=>{
        if(parsed[idx]) state[idx] = parsed[idx];
      });
    }catch(e){}
  }
  renderList();
  updateSummary();
}

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  await storageSet(currentKey(), JSON.stringify(state));
  showToast('저장되었습니다');
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  state = {};
  renderList();
  updateSummary();
});

document.getElementById('shareBtn').addEventListener('click', async ()=>{
  let lines = [`[안전점검] ${siteSelect.value} / ${dateInput.value}`];
  ITEMS.forEach((item, idx)=>{
    const [title] = item;
    lines.push(`${idx+1}. ${title} : ${state[idx] || '미점검'}`);
  });
  const scoreText = document.getElementById('scoreNum').textContent;
  lines.push(`\n환산점수: ${scoreText} / 부적합 ${document.getElementById('failNum').textContent}건`);
  const text = lines.join('\n');
  try{
    await navigator.clipboard.writeText(text);
    showToast('결과가 복사되었습니다');
  }catch(e){
    showToast('복사 실패 - 직접 선택해 복사해주세요');
  }
});

siteSelect.addEventListener('change', loadForCurrentKey);
dateInput.addEventListener('change', loadForCurrentKey);

loadForCurrentKey();
</script>
</body>
</html>
